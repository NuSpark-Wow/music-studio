<!-- LearnWow member pass (do not remove): gets the member pass from nusparklearnwow.com and shows the Join screen when a visitor runs out of tries -->
<script>
(function () {
  if (window.__lwgate) return; window.__lwgate = 1;
  var JOIN = "https://nusparklearnwow.com/join/", LOGIN = "https://nusparklearnwow.com/membership-login/";
  var LW = { pass: null, vid: "" };
  try { LW.vid = localStorage.getItem("lw_vid") || ""; if (!LW.vid) { LW.vid = (Date.now().toString(36) + Math.random().toString(36).slice(2, 12)); localStorage.setItem("lw_vid", LW.vid); } }
  catch (e) { LW.vid = "s" + Math.random().toString(36).slice(2, 12); }
  var okHost = /(^|\.)(nusparklearnwow|nusparkpublishing|nusparkmarketing)\.com$/;
  var ready = new Promise(function (done) {
    if (window.parent === window) return done();
    var fin = false, end = function () { if (!fin) { fin = true; done(); } };
    window.addEventListener("message", function (e) {
      var d = e.data; if (!d || d.type !== "lw-pass") return;
      try { if (!okHost.test(new URL(e.origin).hostname)) return; } catch (x) { return; }
      LW.pass = d.pass || null;
      if (d.vid && /^[a-z0-9]{6,40}$/i.test(d.vid)) LW.vid = "w" + d.vid;
      end();
    });
    try { window.parent.postMessage({ type: "lw-pass-request" }, "*"); } catch (x) {}
    setTimeout(end, 1500);
  });

  var lastAct = 0;
  ["pointerdown", "keydown", "touchstart"].forEach(function (ev) { window.addEventListener(ev, function (e) { if (e.isTrusted) lastAct = Date.now(); }, true); });

  var shown = false;
  function show(j) {
    if (shown) return; shown = true;
    var reason = j && j.lwgate;
    var title = reason === "budget" ? "You've reached this month's limit" : reason === "preview" ? "This is a members feature" : "You've used your tries";
    var text = reason === "budget"
      ? "Your membership has hit its monthly usage limit. It resets at the start of next month. Questions? Contact us at nusparklearnwow.com/support."
      : "Join LearnWow to unlock all 30+ experiences. 7-day trial, then $29.99/month. Cancel anytime.";
    var box = document.createElement("div");
    box.setAttribute("style", "position:fixed;inset:0;z-index:2147483647;background:rgba(10,25,60,.72);display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif");
    var btn = "display:inline-block;margin:6px;padding:14px 28px;border-radius:40px;font-weight:800;font-size:17px;text-decoration:none;";
    box.innerHTML =
      '<div style="background:#123166;color:#fff;max-width:440px;width:100%;border-radius:22px;padding:30px 26px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)">' +
      '<div style="font-size:40px;line-height:1;color:#F2B33D">&#10022;</div>' +
      '<div style="font-size:24px;font-weight:800;margin:10px 0 8px">' + title + '</div>' +
      '<div style="font-size:16px;line-height:1.5;opacity:.92;margin-bottom:18px">' + text + '</div>' +
      (reason === "budget" ? "" : '<a target="_top" href="' + JOIN + '" style="' + btn + 'background:#F2B33D;color:#123166">Join Now</a>') +
      '<a target="_top" href="' + LOGIN + '" style="' + btn + 'background:transparent;color:#fff;border:2px solid rgba(255,255,255,.6)">Member Log In</a>' +
      '<div><button type="button" style="margin-top:10px;background:none;border:0;color:#cfd8ef;font-size:14px;cursor:pointer;text-decoration:underline">Keep looking around</button></div>' +
      "</div>";
    box.querySelector("button").onclick = function () { box.remove(); shown = false; };
    (document.body || document.documentElement).appendChild(box);
  }

  // Tries left: a small note for visitors ("3 of 8 tries left"), plus a friendly heads-up on the last one.
  var nudged = false;
  function tries(left, total) {
    if (!(left >= 0)) return;
    var el = document.getElementById("lwTries");
    if (!el) {
      el = document.createElement("div"); el.id = "lwTries";
      el.setAttribute("style", "position:fixed;left:12px;bottom:12px;z-index:2147483646;background:#123166;color:#fff;border:2px solid #F2B33D;border-radius:999px;padding:7px 12px 7px 14px;font:600 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center");
      (document.body || document.documentElement).appendChild(el);
    }
    el.innerHTML = '<span>&#10022; ' + left + (total ? ' of ' + total : '') + ' tr' + (left === 1 ? 'y' : 'ies') + ' left</span><a target="_top" href="' + JOIN + '" style="color:#F2B33D;font-weight:800;text-decoration:none">Join</a><button type="button" aria-label="Hide" style="background:none;border:0;color:#cfd8ef;font-size:15px;cursor:pointer;padding:0 0 0 2px">&times;</button>';
    el.querySelector("button").onclick = function () { el.remove(); };
    if (left === 1 && !nudged) {
      nudged = true;
      var n = document.createElement("div");
      n.setAttribute("style", "position:fixed;left:12px;bottom:58px;z-index:2147483646;max-width:300px;background:#fff;color:#123166;border-radius:14px;padding:12px 14px;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 10px 26px rgba(0,0,0,.3);border-top:4px solid #F2B33D");
      n.innerHTML = '<b>One try left!</b><br>Members get every one of the 30+ experiences, with no limits. Start with a 7-day trial and cancel anytime.<div style="margin-top:8px"><a target="_top" href="' + JOIN + '" style="background:#F2B33D;color:#123166;font-weight:800;padding:7px 14px;border-radius:999px;text-decoration:none">See membership</a> <button type="button" style="background:none;border:0;color:#123166;text-decoration:underline;cursor:pointer;font-size:13px">Got it</button></div>';
      n.querySelector("button").onclick = function () { n.remove(); };
      (document.body || document.documentElement).appendChild(n);
      setTimeout(function () { if (n.parentNode) n.remove(); }, 15000);
    }
  }

  var of = window.fetch && window.fetch.bind(window);
  if (!of) return;
  window.fetch = function (input, init) {
    var url = typeof input === "string" ? input : (input && input.url) || String(input || "");
    var u; try { u = new URL(url, location.href); } catch (e) { return of(input, init); }
    if (u.origin !== location.origin || u.pathname.indexOf("/api/") !== 0) return of(input, init);
    var act = Date.now() - lastAct < 30000;
    return ready.then(function () {
      var o = {}; if (init) for (var k in init) o[k] = init[k];
      var hd = new Headers(o.headers || (typeof input !== "string" && input && input.headers) || undefined);
      if (LW.pass) hd.set("x-lw-pass", LW.pass);
      hd.set("x-lw-vid", LW.vid);
      if (act) hd.set("x-lw-act", "1");
      o.headers = hd;
      return of(input, o);
    }).then(function (r) {
      if (r.status === 402) r.clone().json().then(function (j) { if (j && j.lwgate) show(j); }).catch(function () {});
      try { var tl = r.headers.get("x-lw-left"); if (tl !== null && r.status !== 402) tries(parseInt(tl, 10), parseInt(r.headers.get("x-lw-total") || "0", 10)); } catch (e) {}
      return r;
    });
  };
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Music Studio</title>
<meta name="description" content="Sing it. See it. Hear it. Write music on a staff, sing notes into it, pick instruments, add vocals and download your song.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#131418;--panel:#1d1f25;--panel2:#25282f;--line:#353943;--ink:#f3efe6;--muted:#b3b0a8;--amber:#f2b33d;--teal:#4fc3b8;--violet:#b39dfa;--coral:#f08a6b;--H:'Space Grotesk',Inter,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--amber)}
#app{max-width:1280px;margin:0 auto;padding:18px 18px 120px}
h1,h2,h3{font-family:var(--H);margin:0;line-height:1.2}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1 1 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.tight{padding:12px}
.label{font-family:var(--H);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#4a4f5c}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1405}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px}
.btn.vocal{border-color:var(--coral);background:#2b1a15}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--teal);border-color:var(--teal);color:#06201d}
.pill{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px;cursor:pointer}
.pill.on{background:var(--teal);border-color:var(--teal);color:#06201d}
.pill.amber.on{background:var(--amber);border-color:var(--amber);color:#1a1405}
.seg{display:flex;gap:6px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
label.f select,label.f input,label.f textarea{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 10px;font-size:15px;text-transform:none;letter-spacing:0}
textarea{border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:10px;font-size:15px;width:100%;resize:vertical;min-height:70px}
input[type=range]{width:100%;accent-color:var(--amber)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--amber);flex:0 0 auto}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.brand{cursor:pointer;display:flex;flex-direction:column;gap:2px;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--H);font-size:24px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.hero{border-radius:14px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}
.hero svg{display:block;width:100%;height:auto}
.map{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.map button{flex:1 0 auto;min-width:76px;min-height:52px;border-radius:10px;border:2px solid transparent;color:#15130d;font-weight:700;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.map button span{font-size:11px;font-weight:600;opacity:.75}
.map button.sel{border-color:var(--ink);box-shadow:0 0 0 2px #000 inset}
.part{display:flex;flex-direction:column;gap:8px}
.part.active{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:0 0 auto}
.staffbox{cursor:crosshair;border-radius:8px;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.staffbox .sv{position:relative}.staffbox .hit{position:absolute;inset:0;z-index:2}.staffbox .tbw{position:absolute;inset:0;z-index:6;pointer-events:none}.staffbox .tbw .ntb{pointer-events:auto}
.pinstaff .staffbox{max-height:34vh;overflow-y:auto;overscroll-behavior:contain}
.ntb.inbar{position:static;transform:none;margin-top:6px;max-width:100%;flex-direction:row}
.pinbar:empty{display:none}
.staffbox.dragging{cursor:grabbing;outline:2px solid var(--amber);outline-offset:2px}
.ntb{position:absolute;z-index:6;transform:translateY(-100%);display:flex;gap:4px;flex-wrap:nowrap;align-items:center;padding:5px;background:rgba(19,20,24,.97);border:1px solid var(--amber);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.45);max-width:calc(100% - 8px);overflow-x:auto;cursor:default}
.ntb .btn.sm{min-height:36px;min-width:36px;padding:0 6px}
.ntb .btn.on{border-color:var(--amber);background:#2a2210;color:var(--ink)}
.btn svg{flex:0 0 auto}
.pinwrap{position:relative}
.pinstaff{position:sticky;top:0;z-index:8;background:var(--bg);padding:8px 0 6px;margin:-4px 0 8px;box-shadow:0 8px 12px -8px rgba(0,0,0,.6)}
html.embedded .pinstaff{position:relative}
.keys{display:flex;position:relative;height:110px;user-select:none;touch-action:none}
.keys .w{flex:1;background:#f5f2ea;border:1px solid #888;border-radius:0 0 6px 6px;position:relative;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;font-size:10px;color:#666;padding-bottom:4px}
.keys .w.down,.keys .b.down{background:var(--amber)}
.keys .b{position:absolute;top:0;height:64%;background:#16171b;border-radius:0 0 4px 4px;cursor:pointer;z-index:2}
.split{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.split .main{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:12px}
.split .side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.opt{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.opt.on{border-color:var(--amber);background:#2a2210}
.lyric{font-family:Georgia,serif;font-size:16px;line-height:1.5;white-space:pre-wrap}
.sugg{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(19,20,24,.96);border-top:1px solid #4a3f6b;backdrop-filter:blur(6px)}
.sugg .in{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sugg .chips{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:thin}
.sugg .chip{flex:0 0 auto;min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--violet);background:#221d33;color:var(--ink);font-size:14px;cursor:pointer;text-align:left;max-width:100%}
.sugg .chip small{display:block;color:var(--muted);font-size:11px}
.sugg.min .chips,.sugg.min .ask{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#2a2e38;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90vw;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal .box{background:var(--bg);border:1px solid var(--line);border-radius:16px;max-width:1100px;width:100%;padding:18px}
.level{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.foot{border-top:1px solid var(--line);padding-top:10px;margin-top:20px;font-size:11px;line-height:1.55;color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--coral);width:0}
.rec{width:120px;height:120px;border-radius:50%;border:6px solid #3a2f12;background:var(--amber);cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;color:#1a1405;font-size:15px}
.rec.live{background:var(--coral);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(240,138,107,.25)}}
.lesson-card{cursor:pointer;text-align:left}
.helpbtn{color:var(--teal);border-color:#2e5a55;min-height:36px;padding:0 10px}
.sugg .chip.word{border-color:var(--teal);background:#14302d}
.done{color:var(--teal);font-weight:700}
.basic .adv,.basic .mod{display:none!important}
.moderate .adv{display:none!important}
.mixer{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.strip{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.blocks{display:flex;gap:8px;flex-wrap:wrap;min-height:60px;padding:8px;border:1px dashed var(--line);border-radius:12px}

@media (max-width:900px){.mobile-only{display:block}.desktop-only{display:none}
 .sugg .chips{flex-wrap:nowrap!important;overflow-x:auto;flex:1 1 100%!important;order:3}

 #app{padding:12px 12px 150px}

 .brand b{font-size:20px}

 .mixer{grid-template-columns:repeat(2,minmax(0,1fr))!important}

}
