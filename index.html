<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Music Studio</title>
<meta name="description" content="Sing it. See it. Hear it. Write music on a staff, sing notes into it, pick instruments, add vocals and download your song.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#131418;--panel:#1d1f25;--panel2:#25282f;--line:#353943;--ink:#f3efe6;--muted:#b3b0a8;--amber:#f2b33d;--teal:#4fc3b8;--violet:#b39dfa;--coral:#f08a6b;--H:'Space Grotesk',Inter,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--amber)}
#app{max-width:1280px;margin:0 auto;padding:18px 18px 120px}
h1,h2,h3{font-family:var(--H);margin:0;line-height:1.2}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1 1 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.tight{padding:12px}
.label{font-family:var(--H);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#4a4f5c}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1405}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px}
.btn.vocal{border-color:var(--coral);background:#2b1a15}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--teal);border-color:var(--teal);color:#06201d}
.pill{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px;cursor:pointer}
.pill.on{background:var(--teal);border-color:var(--teal);color:#06201d}
.pill.amber.on{background:var(--amber);border-color:var(--amber);color:#1a1405}
.seg{display:flex;gap:6px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
label.f select,label.f input,label.f textarea{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 10px;font-size:15px;text-transform:none;letter-spacing:0}
textarea{border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:10px;font-size:15px;width:100%;resize:vertical;min-height:70px}
input[type=range]{width:100%;accent-color:var(--amber)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--amber);flex:0 0 auto}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.brand{cursor:pointer;display:flex;flex-direction:column;gap:2px;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--H);font-size:24px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.hero{border-radius:14px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}
.hero svg{display:block;width:100%;height:auto}
.map{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.map button{flex:1 0 auto;min-width:76px;min-height:52px;border-radius:10px;border:2px solid transparent;color:#15130d;font-weight:700;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.map button span{font-size:11px;font-weight:600;opacity:.75}
.map button.sel{border-color:var(--ink);box-shadow:0 0 0 2px #000 inset}
.part{display:flex;flex-direction:column;gap:8px}
.part.active{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:0 0 auto}
.staffbox{cursor:crosshair;border-radius:8px}
.keys{display:flex;position:relative;height:110px;user-select:none;touch-action:none}
.keys .w{flex:1;background:#f5f2ea;border:1px solid #888;border-radius:0 0 6px 6px;position:relative;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;font-size:10px;color:#666;padding-bottom:4px}
.keys .w.down,.keys .b.down{background:var(--amber)}
.keys .b{position:absolute;top:0;height:64%;background:#16171b;border-radius:0 0 4px 4px;cursor:pointer;z-index:2}
.split{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.split .main{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:12px}
.split .side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.opt{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.opt.on{border-color:var(--amber);background:#2a2210}
.lyric{font-family:Georgia,serif;font-size:16px;line-height:1.5;white-space:pre-wrap}
.sugg{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(19,20,24,.96);border-top:1px solid #4a3f6b;backdrop-filter:blur(6px)}
.sugg .in{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sugg .chips{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:thin}
.sugg .chip{flex:0 0 auto;min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--violet);background:#221d33;color:var(--ink);font-size:14px;cursor:pointer;text-align:left;max-width:100%}
.sugg .chip small{display:block;color:var(--muted);font-size:11px}
.sugg.min .chips,.sugg.min .ask{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#2a2e38;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90vw;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal .box{background:var(--bg);border:1px solid var(--line);border-radius:16px;max-width:1100px;width:100%;padding:18px}
.level{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.foot{border-top:1px solid var(--line);padding-top:10px;margin-top:20px;font-size:11px;line-height:1.55;color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--coral);width:0}
.rec{width:120px;height:120px;border-radius:50%;border:6px solid #3a2f12;background:var(--amber);cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;color:#1a1405;font-size:15px}
.rec.live{background:var(--coral);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(240,138,107,.25)}}
.lesson-card{cursor:pointer;text-align:left}
.helpbtn{color:var(--teal);border-color:#2e5a55;min-height:36px;padding:0 10px}
.sugg .chip.word{border-color:var(--teal);background:#14302d}
.done{color:var(--teal);font-weight:700}
.basic .adv,.basic .mod{display:none!important}
.moderate .adv{display:none!important}
.mixer{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.strip{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.blocks{display:flex;gap:8px;flex-wrap:wrap;min-height:60px;padding:8px;border:1px dashed var(--line);border-radius:12px}
.blocks button{min-height:52px;padding:0 16px;border-radius:10px;border:0;font-weight:700;color:#15130d;cursor:pointer}
.mobile-only{display:none}
@media (max-width:900px){.mobile-only{display:block}.desktop-only{display:none}
 .sugg .chips{flex-wrap:nowrap!important;overflow-x:auto;flex:1 1 100%!important;order:3}
 .sugg .chip{flex:0 0 auto;max-width:78vw}
 .sugg .in{padding:8px 12px;gap:6px}
 .sugg .ctx{display:none}
 .sugg .btn.sm{min-height:36px;padding:0 10px}
 #app{padding:12px 12px 150px}
 .header{gap:8px}
 .brand b{font-size:20px}
 .card{padding:12px}
}
@media print{
 body{background:#fff;color:#000}
 #app,.sugg,.toast,.modal{display:none!important}
 #print{display:block!important}
}
#print{display:none;color:#000;background:#fff;font-family:Georgia,serif;padding:10px}
#print h1{font-family:Georgia,serif;text-align:center;font-size:28px;margin:0}
#print .by{text-align:right;font-size:14px;margin:4px 0 14px}
#print .sec{font:700 13px Inter,sans-serif;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.08em}
#print .pname{font:600 12px Inter,sans-serif;margin:6px 0 2px}
#print .pl{font:italic 13px Georgia,serif;margin:2px 0 8px;white-space:pre-wrap}
#print .note{font:11px Inter,sans-serif;text-align:center;margin-top:18px}
#print .part-sheet{break-inside:avoid}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<script src="glyphs.js"></script>
<script src="staff.js"></script>
<script src="audio.js"></script>
<script src="pitch.js"></script>
<script src="lame.min.js"></script>
<script src="app.js"></script>
<script src="studio.js"></script>
<script src="vocal.js"></script>
<script src="room.js"></script>
<script src="help.js"></script>
<script src="coach.js"></script>
<script>MS.boot();</script>
</body>
</html>
